[project]
name = "doctor-outreach-demo"
version = "0.1.0"
description = "AI-assisted doctor outreach: qualify, verify, dedupe, draft, approve, send, log."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "httpx>=0.27",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The browser tests are laptop only and opt-in: `pytest -m e2e` runs them, a plain `pytest` skips them.
addopts = "-m 'not e2e'"
markers = ["e2e: browser tests in tests/e2e, run with pytest -m e2e (needs Playwright)"]
